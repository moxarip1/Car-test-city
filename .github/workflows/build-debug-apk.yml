name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "debug/debug.apk"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure debug directory is isolated from app assets
        run: |
          rm -rf app/src/main/assets/debug
          find app/src/main -name "*.apk" -delete

      - name: Build Android Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK to root debug/debug.apk
        run: |
          mkdir -p debug
          cp app/build/outputs/apk/debug/app-debug.apk debug/debug.apk
          ls -lh debug/debug.apk

      - name: Commit and push debug/debug.apk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f debug/debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update debug/debug.apk [skip ci]"
            git push
          else
            echo "No APK changes to commit."
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypercar-resort-debug-apk
          path: debug/debug.apk
